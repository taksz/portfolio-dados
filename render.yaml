# Blueprint do Render (https://render.com) para publicar os projetos web do repositório:
# encurtador-url e rastreador-precos (painel em modo demonstração, somente leitura).
# O repositório é um monorepo: rootDir aponta para a pasta do projeto.
services:
  - type: web
    name: encurtador-url
    runtime: python
    plan: free
    rootDir: encurtador-url
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Demonstração: o disco do plano grátis é apagado a cada reinício, então o
      # site recria links com cliques SIMULADOS quando o banco estiver vazio.
      # Sem ENCURTADOR_SENHA o app fica aberto (demonstração pública com dados simulados).
      # Para uso real, adicione ENCURTADOR_SENHA em Environment no painel do Render.
      - key: ENCURTADOR_DEMO
        value: "1"

  - type: web
    name: rastreador-precos
    runtime: python
    plan: free
    rootDir: rastreador-precos
    buildCommand: pip install -r requirements.txt
    # --demo: se o banco estiver vazio, cria histórico SIMULADO sem acessar a internet.
    # --somente-leitura: desliga a coleta (visitantes não podem acionar o site de terceiros).
    startCommand: python src/cli.py servir --host 0.0.0.0 --porta $PORT --limite 25 --somente-leitura --demo
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
