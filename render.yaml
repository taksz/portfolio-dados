# Blueprint do Render (https://render.com) para publicar os projetos web do repositório:
# encurtador-url, rastreador-precos e gestor-anuncios (painéis em modo demonstração, somente leitura)
# e o dashboard comercial do analise-vendas (Streamlit).
# O repositório é um monorepo: rootDir aponta para a pasta do projeto.
services:
  - type: web
    name: dashboard-vendas
    runtime: python
    plan: free
    rootDir: analise-vendas
    # Só as dependências do painel (pandas, numpy, plotly, streamlit). A base de vendas
    # é sintética e reprodutível (mesma semente), então o app a gera em memória ao iniciar.
    buildCommand: pip install -r requirements-dashboard.txt
    startCommand: streamlit run dashboard/app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

  - type: web
    name: encurtador-url
    runtime: python
    plan: free
    rootDir: encurtador-url
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # Demonstração: o disco do plano grátis é apagado a cada reinício, então o
      # site recria links com cliques SIMULADOS quando o banco estiver vazio.
      # Sem ENCURTADOR_SENHA o app fica aberto (demonstração pública com dados simulados).
      # Para uso real, adicione ENCURTADOR_SENHA em Environment no painel do Render.
      - key: ENCURTADOR_DEMO
        value: "1"

  - type: web
    name: rastreador-precos
    runtime: python
    plan: free
    rootDir: rastreador-precos
    buildCommand: pip install -r requirements.txt
    # --demo: se o banco estiver vazio, cria histórico SIMULADO sem acessar a internet.
    # --somente-leitura: desliga a coleta (visitantes não podem acionar o site de terceiros).
    startCommand: python src/cli.py servir --host 0.0.0.0 --porta $PORT --limite 25 --somente-leitura --demo
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10

  - type: web
    name: gestor-anuncios
    runtime: python
    plan: free
    rootDir: gestor-anuncios
    buildCommand: pip install -r requirements.txt
    # --demo: se o banco estiver vazio (o disco grátis é apagado a cada reinício), cria
    # 8 semanas de coletas SIMULADAS de 40 carros fictícios, sem acessar a internet.
    # --somente-leitura: desliga o botão/rota "Coletar agora" (os números ficam estáveis).
    startCommand: python src/cli.py servir --host 0.0.0.0 --porta $PORT --somente-leitura --demo
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
